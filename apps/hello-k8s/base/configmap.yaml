apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-k8s-page
  namespace: hello-k8s
  labels:
    app.kubernetes.io/name: hello-k8s
    app.kubernetes.io/part-of: k8s-practice
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
      <head>
        <meta charset="utf-8">
        <title>Hello Kubernetes</title>
      </head>
      <body>
        <h1>Hello from Kubernetes!</h1>
        <p>This page is served from a ConfigMap.</p>
      </body>
    </html>
