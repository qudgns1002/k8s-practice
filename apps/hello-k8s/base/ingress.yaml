apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-k8s
  namespace: hello-k8s
  labels:
    app.kubernetes.io/name: hello-k8s
    app.kubernetes.io/part-of: k8s-practice
spec:
  ingressClassName: nginx
  rules:
    - host: hello.k8s.core
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-k8s
                port:
                  number: 80
