apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s
  namespace: hello-k8s
  labels:
    app.kubernetes.io/name: hello-k8s
    app.kubernetes.io/part-of: k8s-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-k8s
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
